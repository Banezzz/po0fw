# 让加白 API 走直连，确保服务端看到的是本机真实出口 IP 而不是代理出口。
#
# 为什么必须加这条：TUN / VPN 模式下操作系统把所有流量都交给 mihomo，
# curl 的 --noproxy 只能绕开环境变量里的代理，**绕不过 TUN 路由**。只有
# 让 mihomo 自己把这个目标判成 DIRECT，包才会从物理网卡带着真实源 IP 出去。
#
# ── Clash Verge Rev ──────────────────────────────────────────────────
# 订阅 → 左侧「全局扩展配置」（Merge 类型）→ 编辑，把 prepend-rules 段
# 粘进去。写在这里的规则在订阅更新后依然保留，不会被覆盖。
#
# ── FlClash ──────────────────────────────────────────────────────────
# 设置 → 覆写 → 规则，追加下面那条 IP-CIDR 规则（不需要 prepend-rules
# 这层包装，直接填规则本身）。
#
# 注意：只有**运行 Clash 且自己要上报 IP** 的机器才需要这条。如果你是靠
# 常开设备统一上报、其它机器不发请求，那些机器可以不加。

prepend-rules:
  - IP-CIDR,124.221.69.228/32,DIRECT,no-resolve
